name: gh-pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: "compiler test.ps1 -Suite value"
        required: false
        default: "all"

jobs:
  build:
    if: github.event_name != 'schedule'
    timeout-minutes: 420
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: moonrepo/setup-rust@v1.3.0
        with:
          channel: "nightly-2026-11-05"
          components: "clippy,rust-src,rustfmt"
          targets: "wasm32-unknown-unknown"

      - uses: erlef/setup-beam@v1.24.1
        with:
          otp-version: "29"
          elixir-version: "1.20"
          gleam-version: "1.19.2"
          rebar3-version: "3.28.0"

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "9.0.202"

      - uses: oven-sh/setup-bun@v2.2.0

      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: "0.17.0"

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12.10"

      - run: pwsh scripts/workflow.ps1

      - uses: actions/upload-artifact@v7.0.2
        if: contains(matrix.os, 'ubuntu')
        with:
          name: gh-pages
          path: dist
          retention-days: 30

  compiler:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 360
    runs-on: ubuntu-24.04
    steps:
      - run: echo "SPIRAL_BIN_CACHE_DIR=$RUNNER_TEMP/spiral-bin" >> "$GITHUB_ENV"

      - run: echo "SPIRAL_CTL_COMPILER_DIR=$RUNNER_TEMP/spiral-ctl" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7.0.1

      - uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/spiral-ctl
          key: spiral-ctl-${{ runner.os }}-${{ github.run_id }}
          restore-keys: spiral-ctl-${{ runner.os }}-

      - uses: erlef/setup-beam@v1.24.1
        with:
          otp-version: "29"
          elixir-version: "1.20"
          gleam-version: "1.19.2"
          rebar3-version: "3.28.0"

      - uses: oven-sh/setup-bun@v2.2.0

      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: "0.17.0"

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12.10"

      - run: pwsh scripts/workflow.ps1 -Compiler -Suite ${{ github.event.inputs.suite || 'all' }}

      - if: always()
        run: pwsh scripts/workflow.ps1 -K3s

      - if: always()
        run: git diff --no-color -- apps/compiler/tmp/samples > "$SPIRAL_BIN_CACHE_DIR/samples-output.diff"

      - if: always()
        run: sudo apt-get update -q && sudo apt-get install -y -q linux-tools-common "linux-tools-$(uname -r)" gcc-multilib && (cd apps/compiler/scripts/ebpf_kernel_load && "$SPIRAL_BIN_CACHE_DIR/toolchains/dotnet/dotnet" "$SPIRAL_BIN_CACHE_DIR/bin/single-flight/SpiralCompiler/Release/net11.0/SpiralCompiler.dll" --backend Rust main.spi "$RUNNER_TEMP/ebpf_port.rs" && cd "$GITHUB_WORKSPACE" && rustc -O --edition 2021 "$RUNNER_TEMP/ebpf_port.rs" -o "$RUNNER_TEMP/ebpf_port" && SPIRAL_EBPF_SAMPLES=apps/compiler/tmp/samples "$RUNNER_TEMP/ebpf_port") > "$SPIRAL_BIN_CACHE_DIR/ebpf-kernel-load.txt" 2>&1 || true

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: compiler-oracle
          path: |
            ${{ env.SPIRAL_BIN_CACHE_DIR }}/baseline/EXPECTED.tsv
            ${{ env.SPIRAL_BIN_CACHE_DIR }}/runs
            ${{ env.SPIRAL_BIN_CACHE_DIR }}/samples-output.diff
            ${{ env.SPIRAL_BIN_CACHE_DIR }}/ebpf-kernel-load.txt
          retention-days: 14

  cells-gate:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    timeout-minutes: 240
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: moonrepo/setup-rust@v1.3.0
        with:
          channel: "nightly-2026-11-05"
          components: "rust-src"

      - uses: erlef/setup-beam@v1.24.1
        with:
          otp-version: "29"
          elixir-version: "1.20"
          gleam-version: "1.19.2"
          rebar3-version: "3.28.0"

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "9.0.202"

      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: "0.17.0"

      - uses: oven-sh/setup-bun@v2.2.0

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12.10"

      - run: pwsh scripts/workflow.ps1 -Compiler

      - name: transformer model cache (pins in apps/transformer/oracle.spi)
        run: |
          models="$HOME/.cache/spiral-bin/models/llama2c"
          mkdir -p "$models"
          base=https://huggingface.co/karpathy/tinyllamas/resolve/main/stories260K
          curl -fsSL --retry 3 -o "$models/stories260K.bin" "$base/stories260K.bin"
          curl -fsSL --retry 3 -o "$models/tok512.bin" "$base/tok512.bin"
          printf '%s  %s\n' \
            b0a507e7ad0f626624f17112325e66691f9076d622e1d3274d103d00299f2696 "$models/stories260K.bin" \
            037cb335abb25d1fa9e8ecae30ed2a3a8ace9302862ebcdc05d51a6bbb10c312 "$models/tok512.bin" | sha256sum -c

      - env:
          SPIRAL_CELLS_OPTIONAL_TARGETS: "cuda,wgsl,lua"
        run: pwsh apps/cells/spi/ci_gate.ps1 -Out "${{ runner.temp }}/cells-gate" -Roots lib/spiral,apps/transformer,apps/compiler/tmp/samples/mega_zeta_structural_laboratory,apps/compiler/tmp/samples/mega_spiral_proves_spiral_relative_consistency,apps/compiler/tmp/samples/mega_omniledger_erp_kernel,apps/compiler/tmp/samples/mega_brzozowski_derivatives

      - name: publish cells-gate metrics to the job summary
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $dir = "${{ runner.temp }}/cells-gate"
          $tsv = Join-Path $dir 'cells-gate.tsv'
          if (-not (Test-Path $tsv)) {
            "## Cells gate metrics`n`n_no cells-gate.tsv produced_" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          $lines = Get-Content $tsv | Where-Object { $_ -ne '' }
          $header = $lines[0] -split "`t"
          $out = [Collections.Generic.List[string]]::new()
          $out.Add("## Cells gate metrics")
          $out.Add("")
          $out.Add('| ' + ($header -join ' | ') + ' |')
          $out.Add('| ' + (($header | ForEach-Object { '---' }) -join ' | ') + ' |')
          foreach ($row in ($lines | Select-Object -Skip 1)) {
            $out.Add('| ' + (($row -split "`t") -join ' | ') + ' |')
          }
          $metrics = Get-ChildItem -Path $dir -Filter 'metrics-*' -Directory -ErrorAction SilentlyContinue
          if ($metrics) {
            $out.Add("")
            $out.Add("metrics folders: $($metrics.Count) (per-test timings in metrics-*/tests.tsv, in the cells-gate artifact)")
          }
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, ($out -join "`n") + "`n")

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: cells-gate
          path: ${{ runner.temp }}/cells-gate

  granular-lint:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/checkout@v7.0.1
        with:
          repository: i574n/rig
          path: rig

      - uses: moonrepo/setup-rust@v1.3.0
        with:
          channel: "nightly-2026-11-05"

      - uses: actions/cache@v6.1.0
        with:
          path: rig/src/target
          key: granular-lint-rig-${{ hashFiles('rig/src/Cargo.lock') }}

      - name: build rig
        working-directory: rig/src
        run: cargo build -p rig-cli --bin rig

      - name: granular lint on the lib modules this change touches
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=$(git rev-parse HEAD~1); fi
          mapfile -t files < <(git diff --name-only --diff-filter=AM "$BASE" HEAD -- lib/spiral | grep '\.spi$' | sed 's#^lib/spiral/##')
          if [ ${#files[@]} -eq 0 ]; then echo "no lib module changed"; exit 0; fi
          rig/src/target/debug/rig lint macros lib/spiral "${files[@]}" --baseline .github/granular-baseline.spi

  push:
    needs: [build, cells-gate, granular-lint]
    if: github.event_name == 'push'
    timeout-minutes: 180
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8.0.2
        with:
          name: gh-pages
          path: gh-pages

      - run: echo "$GITHUB_SHA" > gh-pages/_deploy.txt

      - uses: actions/download-artifact@v8.0.2
        if: always()
        continue-on-error: true
        with:
          name: cells-gate
          path: cells-gate-artifact

      - name: emit the cells-gate metrics page
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $tsv = 'cells-gate-artifact/cells-gate.tsv'
          if (-not (Test-Path $tsv)) { exit 0 }
          $lines = Get-Content $tsv | Where-Object { $_ -ne '' }
          $header = $lines[0] -split "`t"
          $sb = [Text.StringBuilder]::new()
          [void]$sb.Append('<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>cells gate metrics</title>')
          [void]$sb.Append('<h1>Cells gate metrics</h1><p>Latest scheduled/push cells-gate run. Per-test timings are in the cells-gate artifact (metrics-*/tests.tsv).</p>')
          [void]$sb.Append('<table border="1" cellpadding="4" style="border-collapse:collapse"><tr>')
          foreach ($h in $header) { [void]$sb.Append('<th>' + $h + '</th>') }
          [void]$sb.Append('</tr>')
          foreach ($row in ($lines | Select-Object -Skip 1)) {
            [void]$sb.Append('<tr>')
            foreach ($c in ($row -split "`t")) { [void]$sb.Append('<td>' + $c + '</td>') }
            [void]$sb.Append('</tr>')
          }
          [void]$sb.Append('</table>')
          New-Item -ItemType Directory -Force gh-pages | Out-Null
          [IO.File]::WriteAllText('gh-pages/cells-gate.html', $sb.ToString())

      - uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: gh-pages
          force_orphan: true

      - name: verify the deploy is live
        shell: pwsh
        run: |
          $url = 'https://i574n.github.io/${{ github.event.repository.name }}/'
          $deadline = (Get-Date).AddMinutes(6)
          do {
              $live = try { (Invoke-WebRequest "${url}_deploy.txt?t=$([DateTime]::UtcNow.Ticks)" -SkipHttpErrorCheck).Content.Trim() } catch { '' }
              if ($live -ne $env:GITHUB_SHA) { Start-Sleep 15 }
          } while ($live -ne $env:GITHUB_SHA -and (Get-Date) -lt $deadline)
          if ($live -ne $env:GITHUB_SHA) { throw "pages serve '$live', expected $env:GITHUB_SHA" }
          $html = (Invoke-WebRequest "${url}?t=$([DateTime]::UtcNow.Ticks)").Content
          foreach ($mark in 'id="readme"|class="readme', 'name="viewport"') { if ($html -notmatch $mark) { throw "index lacks $mark" } }
