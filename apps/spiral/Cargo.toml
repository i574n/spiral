cargo-features = ["edition2024"]

[package]
name = "spiral"
workspace = "../../workspace"
version.workspace = true
# the generated code is verified with edition 2021 (the staged native builds before this crate)
edition = "2021"
license-file.workspace = true
repository.workspace = true

build = "build.rs"

[build-dependencies]
winres = "0.1"

# spiral.rs is spiral.spi's native Rust output (build.ps1 regenerates it with the Spiral compiler's Rust backend), with
# mimalloc as the global allocator. Built with the workspace's release-unwind profile: lib's `try` catches panics.
[[bin]]
name = "spiral"
path = "spiral.rs"

[dependencies]
mimalloc = { version = "0.1", default-features = false }
chrono = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
encoding_rs = ">=0.8,<1"
encoding_rs_io = ">=0.1,<1"
async-walkdir = "2.0"
mlua = { version = ">=0.11.4", features = ["lua51", "vendored"] }
