cargo-features = ["edition2024"]

[package]
name = "spiral_wasm"
workspace = "../../workspace"
version.workspace = true
edition = "2021"
license-file.workspace = true
repository.workspace = true

[[bin]]
name = "spiral_wasm"
path = "spiral_wasm.rs"

[dependencies]
anyhow = "1.0"
clap = { workspace = true }
tokio = { version = "1.40", features = ["full"] }
near-workspaces = { version = "=0.11.1", default-features = false, features = ["experimental", "unstable"] }
near-sandbox-utils = { version = ">=0.11,<1", features = ["global_install"] }
near-sdk = "=5.11.0"
