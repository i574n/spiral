[package]
name = "zed_spiral"
version = "0.1.0"
edition = "2021"
description = "Spiral language extension for Zed"
license = "Apache-2.0"
authors = ["Marko Grdinić", "i574n"]

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "spiral-zed"
path = "src/bin/spiral_zed.rs"

[dependencies]
zed_extension_api = "0.7.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints.rust]
dead_code = "allow"
unused_variables = "allow"
